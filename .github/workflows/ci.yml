name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Regenerate API types
        run: npm run generate:types

      - name: Fail if generated types are stale
        run: git diff --exit-code -- src/types/api.d.ts src/types/api.zod.ts

      - run: npm run build
